name: Build OAF kernel module

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd git build-essential libncurses-dev flex bison libxtables-dev libnftables-dev

      - name: Download and extract SDK
        run: |
          wget https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq50xx/immortalwrt-sdk-qualcommax-ipq50xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          mkdir -p sdk
          tar -I zstd -xf immortalwrt-sdk-qualcommax-ipq50xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst -C sdk --strip-components=1
          echo "SDK_DIR=$(pwd)/sdk" >> $GITHUB_ENV

      - name: Clone OAF
        run: git clone https://github.com/destan19/OpenAppFilter.git $SDK_DIR/package/oaf

      - name: Update feeds
        working-directory: sdk
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Prepare config and enable kmod-oaf
        working-directory: sdk
        run: |
          export TERM=dumb
          if [ ! -f .config ]; then
            make defconfig
          fi
          # 强制启用 OAF 内核模块及所需依赖
          echo "CONFIG_PACKAGE_kmod-oaf=m" >> .config
          echo "CONFIG_PACKAGE_appfilter=m" >> .config   # 可选，如果需要一起编译
          echo "# CONFIG_KERNEL_NF_CONNTRACK_EVENTS is not set" >> .config   # 可能需要，按需
          # 使配置生效
          make defconfig

      - name: Compile kmod-oaf
        working-directory: sdk
        run: |
          export TERM=dumb
          make package/oaf/compile V=s

      - name: Find and extract oaf.ko
        working-directory: sdk
        run: |
          # 先找出 kmod-oaf 生成的 ipk 文件
          IPK=$(find bin -name "kmod-oaf_*.ipk" | head -1)
          if [ -z "$IPK" ]; then
            echo "Error: No kmod-oaf ipk found! Listing bin directory:"
            find bin -type f
            exit 1
          fi
          mkdir -p ../artifact
          tar xzf "$IPK" -C ../artifact/
          find ../artifact -name "oaf.ko" -exec cp {} ./oaf.ko \;
          echo "oaf.ko extracted successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ko
          path: sdk/oaf.ko
