name: Build OAF kernel module

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd git build-essential libncurses-dev flex bison libxtables-dev libnftables-dev

      - name: Download and extract SDK
        run: |
          wget https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq50xx/immortalwrt-sdk-qualcommax-ipq50xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          mkdir -p sdk
          tar -I zstd -xf immortalwrt-sdk-qualcommax-ipq50xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst -C sdk --strip-components=1
          echo "SDK_DIR=$(pwd)/sdk" >> $GITHUB_ENV

      - name: Clone OAF
        run: git clone https://github.com/destan19/OpenAppFilter.git $SDK_DIR/package/oaf

      - name: Update feeds
        working-directory: sdk
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Compile kmod-oaf
        working-directory: sdk
        run: make package/oaf/compile V=s

      - name: Extract oaf.ko
        working-directory: sdk
        run: |
          mkdir -p ../artifact
          tar xzf bin/packages/aarch64_cortex-a53/oaf/kmod-oaf_*.ipk -C ../artifact/
          find ../artifact -name "oaf.ko" -exec cp {} ./oaf.ko \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ko
          path: sdk/oaf.ko
